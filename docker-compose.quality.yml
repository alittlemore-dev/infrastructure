name: alittlemore-infra-quality

x-quality-tool: &quality-tool
  cpus: 1
  mem_limit: 256m
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  trivy:
    <<: *quality-tool
    image: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint:
      - trivy

  hadolint:
    <<: *quality-tool
    image: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    entrypoint:
      - hadolint
    network_mode: none

  shellcheck:
    <<: *quality-tool
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    entrypoint:
      - shellcheck
    network_mode: none
