name: Infrastructure CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configuration tests
        run: make tests

      - name: Static configuration checks
        run: make check

      - name: Dockerfile and shell lint
        run: make lint-dockerfiles

      - name: Trivy configuration scan
        run: make security-trivy-config
